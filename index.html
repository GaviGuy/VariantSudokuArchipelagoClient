<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connect to your Variant Sudoku Archipelago slot in this web client">
    <title>Variant Sudoku AP</title>

    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <link rel="stylesheet" type="text/css" href="Styles/Main.css">
    <link rel="stylesheet" type="text/css" href="Styles/ConnectionMenu.css">
    <link rel="stylesheet" type="text/css" href="Styles/TopBar.css">
    <link rel="stylesheet" type="text/css" href="Styles/Tabs.css">
    <link rel="stylesheet" type="text/css" href="Styles/PuzzleList.css">
    <link rel="stylesheet" type="text/css" href="Styles/TextChat.css">
    <script type="module" src="Scripts/Archipelago.js"></script>
    <script type="module" src="Scripts/PuzzleList.js"></script>
    <script defer type="text/javascript" src="Scripts/Main.js"></script>
    <script defer type="text/javascript" src="Scripts/TopMenu.js"></script>
    <script defer type="text/javascript" src="Scripts/Tabs.js"></script>
</head>
<body>
    <div id="connection-info">
        <span id="top-text">Not currently connected</span>
        <button id="top-disconnect">Disconnect</button>
    </div>
    <div id="top-menu" state="0">
        <div>
            <div id="connection-panel">
                <div>
                    <label for="input-address">Address and Port: </label>
                    <input type="text" id="input-address"
                        placeholder="address:port" value="localhost.gg:38281"></input>
                </div>
                <div>
                    <label for="input-username">Username: </label>
                    <input type="text" id="input-username"></input>
                </div>
                <div>
                    <label for="input-password">Password: </label>
                    <input type="password" id="input-password"></input>
                </div>
                <div>
                    <button id="controls-connect">Connect</button>
                    <button id="controls-disconnect" disabled>Disconnect</button>
                    <button id="controls-censor">x</button>
                </div>
            </div>
        </div>
        <button id="top-arrow">Connection Info</button>
    </div>
    <div id="tab-body">
        <div id="tab-buttons">
            <button class="active">Dashboard</button>
            <button>Puzzle List</button>
            <button>AP Chat</button>
        </div>
        <div id="tab-contents">
            <div id="tab0" class="active">
                dashboard
            </div>
            <div id="tab1">
                puzzle list
                <div id="tab1-list">
                </div>
            </div>
            <div id="tab2">
                AP text client
                <div id="chat">
                    <div id="chat-log"></div>
                    <input id="chat-input"></input>
                    <button id="chat-send">Send Message</button>
                </div>
            </div>
        </div>
    </div>
</body>
